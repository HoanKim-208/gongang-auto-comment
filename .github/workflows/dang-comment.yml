name: Đăng comment Gọn Gàng Shop

on:
  schedule:
    # Chạy 5 phút một lần trong khung 20:00-23:55 giờ VN (13:00-16:55 UTC)
    - cron: "*/5 13-16 * * *"
  workflow_dispatch:   # cho phép bấm chạy tay trên GitHub

permissions:
  contents: write

concurrency:
  group: dang-comment
  cancel-in-progress: false

jobs:
  dang-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đăng comment tới hạn
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 dang_comment.py

      - name: Ghi lại trạng thái vào lich.json
        run: |
          if [[ -n "$(git status --porcelain lich.json)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add lich.json
            git commit -m "Cập nhật trạng thái lịch comment"
            git push
          else
            echo "lich.json không đổi"
          fi
